name: Build Email Service

on:
  pull_request:
  push:
    branches: ['main']
    tags: ['v*']
    paths-ignore:
      - 'infra/k8s/**'

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: true

jobs:
  docker:
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: USA-RedDragon/reusable-actions/.github/workflows/docker-ci.yaml@ff5d8c9d1d9fda2d1ca4cb4325987a429db9a85a # v2.0.39
    with:
      push: ${{ github.event_name != 'pull_request' }}
